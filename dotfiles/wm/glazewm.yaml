general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: true

  cursor_jump:
    enabled: true
    trigger: "monitor_focus"

  hide_method: "cloak"
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: "8px"
  outer_gap:
    top: "8px"
    right: "8px"
    bottom: "8px"
    left: "8px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#7aa2f7"
  other_windows:
    border:
      enabled: false

window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: "1"
    display_name: "dev-1"
  - name: "2"
    display_name: "term"
  - name: "3"
    display_name: "web"
  - name: "4"
    display_name: "chat"
  - name: "5"
    display_name: "mail"
  - name: "6"
    display_name: "docs"
  - name: "7"
    display_name: "db-api"
  - name: "8"
    display_name: "media"
  - name: "9"
    display_name: "misc"

window_rules:
  # Ignore helper / overlay windows
  - commands: ["ignore"]
    match:
      - window_process: { equals: "zebar" }
      - window_process: { equals: "PowerToys" }
      - window_title: { equals: "Command Palette" }
        window_class: { equals: "WinUIDesktopWin32WindowClass" }
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

  # Float common dialogs
  - commands: ["set-floating --centered"]
    match:
      - window_title: { regex: "^(Open|Save As|Save|Import|Export|Print|Run)$" }
      - window_class: { regex: "#32770" }

  # Toggl always floating
  - commands: ["set-floating --centered"]
    match:
      - window_process: { equals: "TogglTrack" }

  # Utility floaters
  - commands: ["set-floating --centered"]
    match:
      - window_process: { regex: "Greenshot|ScreenToGif|TeamViewer|RustDesk|Mouseless|Keymapp|UniGetUI|AusweisApp" }

  # Terminals / shells
  - commands: ["move --workspace 2"]
    match:
      - window_process: { regex: "WindowsTerminal|wt|wezterm-gui|Alacritty|cmd|pwsh|bash|ubuntu|debian|wsl" }

  # Browsers
  - commands: ["move --workspace 3"]
    match:
      - window_process: { regex: "chrome|msedge|firefox|brave|zen|comet" }

  # Chat / communication
  - commands: ["move --workspace 4"]
    match:
      - window_process: { regex: "Teams|Slack|Discord|Chatbox" }

  # Mail
  - commands: ["move --workspace 5"]
    match:
      - window_process: { regex: "thunderbird|olk|outlook" }

  # Docs / notes / PDFs / Office docs
  - commands: ["move --workspace 6"]
    match:
      - window_process: { regex: "Obsidian|Acrobat|SumatraPDF|WINWORD" }

  # DB / API / data tooling
  - commands: ["move --workspace 7"]
    match:
      - window_process: { regex: "DataGrip|DBeaver|Postman|Bruno|Studio 3T|MongoDBCompass|NoSQLBooster|Azure Data Studio|TablePlus|DbGate|DB Browser for SQLite|RedisInsight|ResponsivelyApp|Yaak" }

  # Media
  - commands: ["move --workspace 8"]
    match:
      - window_process: { regex: "Spotify|vlc|mpv|muffon" }

  # Misc repo / tooling windows
  - commands: ["move --workspace 9"]
    match:
      - window_process: { regex: "GitKraken|Docker Desktop|BCUninstaller|Raspberry Pi Imager|Azure Storage Explorer" }

binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["resize --width -3%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +3%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +3%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -3%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter", "alt+r"]

keybindings:
  # Focus
  - commands: ["focus --direction left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down"]

  # Move windows
  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  # Resize mode
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # Window state
  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v"]
  - commands: ["wm-cycle-focus"]
    bindings: ["alt+space"]
  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space"]
  - commands: ["toggle-tiling"]
    bindings: ["alt+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]
  - commands: ["toggle-minimized"]
    bindings: ["alt+m"]
  - commands: ["close"]
    bindings: ["alt+shift+q"]

  # WM lifecycle
  - commands: ["wm-toggle-pause"]
    bindings: ["alt+shift+p"]
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]
  - commands: ["wm-redraw"]
    bindings: ["alt+shift+w"]
  - commands: ["wm-exit"]
    bindings: ["alt+shift+e"]

  # Launch terminal
  - commands: ["shell-exec wt"]
    bindings: ["alt+enter"]

  # Workspace cycling
  - commands: ["focus --prev-active-workspace"]
    bindings: ["alt+a"]
  - commands: ["focus --next-active-workspace"]
    bindings: ["alt+s"]
  - commands: ["focus --recent-workspace"]
    bindings: ["alt+d"]

  # Focus workspace
  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["alt+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["alt+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["alt+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["alt+9"]

  # Move current window to workspace and follow it
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]

  # Move workspace between monitors
  - commands: ["move-workspace --direction left"]
    bindings: ["alt+ctrl+h"]
  - commands: ["move-workspace --direction right"]
    bindings: ["alt+ctrl+l"]
  - commands: ["move-workspace --direction up"]
    bindings: ["alt+ctrl+k"]
  - commands: ["move-workspace --direction down"]
    bindings: ["alt+ctrl+j"]
