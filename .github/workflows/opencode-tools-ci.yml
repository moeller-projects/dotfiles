name: opencode-tools-ci

on:
  push:
    branches:
      - main
    paths:
      - "packages/opencode-tools/**"
      - "bootstrap/opencode/**"
      - "scripts/**"
      - "schemas/**"
      - "dotfiles/ai-agents/opencode/tools/**"
      - ".github/workflows/opencode-tools-ci.yml"
  pull_request:
    paths:
      - "packages/opencode-tools/**"
      - "bootstrap/opencode/**"
      - "scripts/**"
      - "schemas/**"
      - "dotfiles/ai-agents/opencode/tools/**"
      - ".github/workflows/opencode-tools-ci.yml"
  workflow_dispatch:

jobs:
  build-tools:
    name: Build opencode-tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/opencode-tools

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/opencode-tools/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-tools-dist
          path: packages/opencode-tools/dist/
          retention-days: 7

  smoke-test:
    name: Smoke test tools
    runs-on: ubuntu-latest
    needs: build-tools
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-tools-dist
          path: packages/opencode-tools/dist/

      - name: Run smoke tests
        run: bash scripts/smoke-opencode-tools.sh

  doctor-check:
    name: Doctor check
    runs-on: ubuntu-latest
    needs: build-tools
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-tools-dist
          path: packages/opencode-tools/dist/

      - name: Run doctor (JSON mode)
        run: bash bootstrap/opencode/doctor.sh --json

  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills
        run: bash scripts/validate-skills.sh

  validate-config-schema:
    name: Validate config schema
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate opencode.jsonc (from dotfiles)
        run: |
          bash scripts/validate-opencode-config.sh \
            dotfiles/ai-agents/opencode/config.jsonc
